  <style>
    /* ═══════════════════════════════════════════════════════════════════
       1. DESIGN TOKENS — CARBON OBSIDIAN & ELECTRIC CYAN (#06B6D4)
       ═══════════════════════════════════════════════════════════════════ */
    :root {
      --bg: #06080c;
      --bg-elevated: #0c1017;
      --bg-card: #10151f;
      --bg-card-hover: #141b28;
      --ink: #f8fafc;
      --ink-secondary: #cbd5e1;
      --ink-muted: #7c8b9e;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --cyan: #06b6d4;
      --cyan-bright: #22d3ee;
      --cyan-soft: rgba(6, 182, 212, 0.12);
      --cyan-glow: rgba(6, 182, 212, 0.28);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-snappy: cubic-bezier(0.215, 0.61, 0.355, 1);
      --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [x-cloak] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: 6rem; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: clip;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    ::selection { background: var(--cyan); color: #041014; }
    :focus-visible { outline: 2px solid var(--cyan-bright); outline-offset: 3px; border-radius: 6px; }

    .tabular { font-variant-numeric: tabular-nums; }
    .wrap { width: min(1280px, calc(100% - 48px)); margin-inline: auto; }
    .icon-sm { width: 16px; height: 16px; flex: 0 0 auto; display: block; }
    .icon-xs { width: 14px; height: 14px; flex: 0 0 auto; display: block; }

    /* Tactile Press & Micro-Interactions */
    .tactile {
      transition: transform 120ms var(--ease-snappy),
                  background-color 160ms var(--ease-snappy),
                  border-color 160ms var(--ease-snappy),
                  box-shadow 200ms var(--ease-out);
    }
    .tactile:active { transform: scale(0.97); }

    /* Subtle Film Grain Texture */
    .noise-layer {
      position: fixed;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ═══════════════════════════════════════════════════════════════════
       2. SUPAHERO FLOATING GLASS NAVBAR (ZERO CLUTTER)
       ═══════════════════════════════════════════════════════════════════ */
    .floating-nav-wrap {
      position: fixed;
      top: 18px;
      left: 0;
      right: 0;
      z-index: 60;
      padding-inline: 24px;
      transition: transform 260ms var(--ease-out);
    }
    .floating-nav-wrap.is-hidden { transform: translateY(-140%); }

    .floating-nav {
      width: min(1120px, 100%);
      height: 60px;
      margin-inline: auto;
      padding: 0 10px 0 20px;
      border-radius: 999px;
      background: rgba(12, 16, 23, 0.76);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--border);
      background-clip: padding-box;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.03em;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan-bright);
      box-shadow: 0 0 14px var(--cyan);
    }

    .nav-center {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-secondary);
    }
    .nav-center a { transition: color 150ms ease; }
    .nav-center a:hover { color: var(--ink); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-lang {
      height: 38px;
      min-width: 44px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font: 600 11px var(--mono);
      color: var(--ink-secondary);
      cursor: pointer;
    }
    @media (hover: hover) and (pointer: fine) {
      .pill-lang:hover { border-color: var(--border-strong); color: var(--ink); }
    }

    .pill-cta {
      height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      border: 0;
      background: var(--ink);
      color: #06080c;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    @media (hover: hover) and (pointer: fine) {
      .pill-cta:hover { background: var(--cyan-bright); }
    }

    /* ═══════════════════════════════════════════════════════════════════
       3. SUPAHERO-INSPIRED ARCHITECTURAL SHOWROOM HERO (100svh)
       ═══════════════════════════════════════════════════════════════════ */
    .hero-stage {
      position: relative;
      min-height: 100svh;
      padding: 148px 0 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      isolation: isolate;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    /* Spotlight Beam & Showroom Horizon SVG */
    .hero-spotlight {
      position: absolute;
      top: -18%;
      left: 50%;
      width: min(1100px, 140vw);
      height: 620px;
      transform: translateX(-50%);
      z-index: -2;
      background: radial-gradient(50% 50% at 50% 35%, rgba(6, 182, 212, 0.22) 0%, rgba(6, 182, 212, 0.05) 48%, transparent 75%);
      pointer-events: none;
    }
    .hero-grid-floor {
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(65% 60% at 50% 42%, #000 15%, transparent 78%);
      -webkit-mask-image: radial-gradient(65% 60% at 50% 42%, #000 15%, transparent 78%);
    }

    .hero-content {
      max-width: 920px;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.28);
      background: rgba(6, 182, 212, 0.08);
      font: 500 11px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan-bright);
      margin-bottom: 28px;
    }

    .hero-h1 {
      margin: 0 0 22px;
      font-weight: 800;
      font-size: clamp(2.85rem, 6.2vw, 5.5rem);
      line-height: 1.01;
      letter-spacing: -0.045em;
      text-wrap: balance;
      background: linear-gradient(180deg, #ffffff 35%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-sub {
      margin: 0 0 36px;
      max-width: 58ch;
      font-size: clamp(16px, 1.35vw, 18.5px);
      line-height: 1.65;
      color: var(--ink-secondary);
      font-weight: 400;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn-cyan {
      min-height: 50px;
      padding: 0 26px;
      border-radius: 999px;
      border: 0;
      background: var(--cyan);
      color: #031318;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 32px rgba(6, 182, 212, 0.32);
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-cyan:hover {
        background: var(--cyan-bright);
        transform: translateY(-2px);
        box-shadow: 0 8px 36px rgba(34, 211, 238, 0.42);
      }
    }

    .btn-secondary {
      min-height: 50px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    @media (hover: hover) and (pointer: fine) {
      .btn-secondary:hover {
        border-color: rgba(255, 255, 255, 0.32);
        background: rgba(255, 255, 255, 0.06);
      }
    }

    /* Automotive Acoustic & Showroom Horizon Visual (Pure Precision Vector) */
    .hero-visual-arc {
      width: min(980px, 100%);
      margin-top: 44px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      text-align: left;
    }
    .arc-stat {
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
    }
    .arc-stat span {
      display: block;
      font: 500 10.5px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan-bright);
      margin-bottom: 4px;
    }
    .arc-stat strong {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
    }

    /* ═══════════════════════════════════════════════════════════════════
       4. TRAINING PROGRAM SELECTOR (7 DEALERSHIP MODULES)
       ═══════════════════════════════════════════════════════════════════ */
    .sec-pad { padding-block: 108px; }
    .sec-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 48px;
    }
    .sec-kicker {
      display: block;
      font: 600 11px var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan-bright);
      margin-bottom: 10px;
    }
    .sec-h2 {
      margin: 0;
      font-weight: 800;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.06;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }
    .sec-desc {
      margin: 0;
      max-width: 46ch;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-muted);
    }

    /* Department Filter Pills */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .filter-pill {
      min-height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
    }
    .filter-pill.is-active {
      background: var(--ink);
      color: #06080c;
      border-color: var(--ink);
    }

    /* 7-Program Bento Grid */
    .programs-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }
    .prog-card {
      grid-column: span 4;
      position: relative;
      border-radius: 16px;
      padding: 26px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      background-clip: padding-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      transition: transform 180ms var(--ease-out), border-color 180ms ease, background-color 180ms ease, box-shadow 220ms var(--ease-out);
    }
    .prog-card.is-wide { grid-column: span 6; }

    @media (hover: hover) and (pointer: fine) {
      .prog-card:hover {
        background: var(--bg-card-hover);
        border-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }
    }
    .prog-card.is-selected {
      border-color: var(--cyan);
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.09) 0%, var(--bg-card) 100%);
      box-shadow: 0 0 0 1px var(--cyan), 0 18px 40px rgba(6, 182, 212, 0.12);
    }

    .prog-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .prog-num {
      font: 600 11px var(--mono);
      letter-spacing: 0.08em;
      color: var(--cyan-bright);
    }
    .prog-duration {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font: 500 11px var(--mono);
      color: var(--ink-muted);
    }
    .prog-title {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }
    .prog-summary {
      margin: 0 0 18px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--ink-muted);
    }
    .prog-outcomes {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 9px;
    }
    .prog-outcomes li {
      position: relative;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink-secondary);
    }
    .prog-outcomes li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .prog-footer {
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .select-toggle-btn {
      width: 100%;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.03);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .prog-card.is-selected .select-toggle-btn {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #031318;
    }

    /* ═══════════════════════════════════════════════════════════════════
       5. ENGAGEMENT FORMATS (3 ARCHITECTURAL STEPS)
       ═══════════════════════════════════════════════════════════════════ */
    .formats-sec {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .formats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    .format-card {
      padding: 30px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .format-card h3 {
      margin: 10px 0 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .format-card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-muted);
    }

    /* ═══════════════════════════════════════════════════════════════════
       6. BOOKING CONFIGURATOR SECTION
       ═══════════════════════════════════════════════════════════════════ */
    .booking-box {
      border-radius: 20px;
      padding: clamp(28px, 4vw, 52px);
      background:
        radial-gradient(60% 80% at 100% 0%, rgba(6, 182, 212, 0.14), transparent 70%),
        var(--bg-card);
      border: 1px solid var(--border-strong);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }
    .selected-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 28px;
    }
    .chip-item {
      min-height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip-item.is-on {
      border-color: var(--cyan);
      background: var(--cyan-soft);
      color: var(--cyan-bright);
    }

    .form-grid {
      display: grid;
      gap: 16px;
    }
    .field-label {
      display: block;
      font: 500 11px var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 7px;
    }
    .field-input {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
    }
    textarea.field-input {
      padding: 12px 14px;
      min-height: 92px;
      resize: vertical;
    }

    /* Floating Selection Bar (appears when programs are picked) */
    .selection-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 55;
      width: min(760px, calc(100% - 32px));
      padding: 10px 12px 10px 20px;
      border-radius: 999px;
      background: rgba(12, 16, 23, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(34, 211, 238, 0.35);

        get filteredPrograms() {
          if (this.filter === 'all') return this.programs;
          return this.programs.filter(p => p.group === this.filter);
        },

        isSelected(id) {
          return this.selectedIds.includes(id);
        },

        toggleProgram(id) {
          if (this.isSelected(id)) {
            this.selectedIds = this.selectedIds.filter(item => item !== id);
          } else {
            this.selectedIds.push(id);
          }
        },

        toggleLang() {
          this.lang = this.lang === 'pl' ? 'en' : 'pl';
          localStorage.setItem('lang', this.lang);
        },

        submitBooking() {
          const chosen = this.programs
            .filter(p => this.selectedIds.includes(p.id))
            .map(p => '• ' + p.title[this.lang])
            .join('\n');

          const subject = this.lang === 'pl'
            ? `Zapytanie o szkolenie BDC Academy — ${this.form.dealer}`
            : `BDC Academy Training Enquiry — ${this.form.dealer}`;

          const body = this.lang === 'pl'
            ? `Dzień dobry Arturze,\n\nZgłaszający / Dealer: ${this.form.dealer}\nE-mail: ${this.form.email}\nFormuła: ${this.form.format}\n\nWybrane programy szkoleniowe:\n${chosen || '• Do ustalenia podczas rozmowy'}\n\nDodatkowe informacje:\n${this.form.notes}`
            : `Hi Artur,\n\nName / Dealership: ${this.form.dealer}\nEmail: ${this.form.email}\nFormat: ${this.form.format}\n\nSelected Training Programs:\n${chosen || '• To be discussed'}\n\nNotes:\n${this.form.notes}`;

          window.location.href = `mailto:artur.zaluska@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        },

        init() {
          window.addEventListener('scroll', () => {
            const y = window.scrollY;
            this.navHidden = y > 180 && y > this.lastScrollY;
            this.lastScrollY = y;
          }, { passive: true });

          if (window.gsap && window.ScrollTrigger && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            gsap.registerPlugin(ScrollTrigger);
            gsap.from('.reveal-hero', {
              y: 22,
              opacity: 0,
              duration: 0.75,
              stagger: 0.1,
              ease: 'power3.out',
              clearProps: 'transform,opacity'
            });
            gsap.utils.toArray('.reveal').forEach(el => {
              gsap.from(el, {
                y: 24,
                opacity: 0,
                duration: 0.65,
                ease: 'power3.out',
                scrollTrigger: { trigger: el, start: 'top 88%', once: true },
                clearProps: 'transform,opacity'
              });
            });
          }
        }
      };
    }
