    </div>

    <div class="relative z-10 max-w-7xl mx-auto px-6 py-24 grid lg:grid-cols-12 gap-12 items-end">
      <div class="lg:col-span-8">

        </div>

        </div>

          <p class="font-display text-3xl font-bold text-white">Door-to-Door</p>
          <p class="text-xs text-zinc-400 mt-1" x-text="t.stat3"></p>
        </div>
        <div class="border-l-2 border-brass pl-4">

          <p class="text-xs text-zinc-400 mt-1" x-text="t.stat4"></p>
        </div>

  <!-- 3 PILLARS OF BUSINESS -->

        <h2 class="font-display text-3xl md:text-5xl font-bold text-white" x-text="t.servicesTitle"></h2>
      </div>
      <p class="text-zinc-400 text-sm max-w-md mt-4 md:mt-0" x-text="t.servicesDesc"></p>
    </div>

    <div class="grid md:grid-cols-3 gap-8">
      <template x-for="(srv, idx) in t.servicesList" :key="idx">
        <div class="bg-charcoal border border-zinc-800/80 hover:border-brass/60 rounded-2xl p-8 transition-all flex flex-col justify-between group">
          <div>
            <div class="flex items-center justify-between mb-8">
              <span class="font-display text-4xl text-brass/40 group-hover:text-brass transition-colors" x-text="'0' + (idx + 1)"></span>
              <span class="text-xs uppercase tracking-widest px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300" x-text="srv.tag"></span>
            </div>
            <h3 class="font-display text-2xl font-bold text-white mb-4" x-text="srv.title"></h3>
            <p class="text-zinc-400 text-sm leading-relaxed mb-6" x-text="srv.desc"></p>
          </div>
          <ul class="space-y-2 border-t border-zinc-800/80 pt-5 text-xs text-zinc-300">
            <template x-for="bullet in srv.bullets" :key="bullet">
              <li class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-brass"></span>
                <span x-text="bullet"></span>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </div>
  </section>

  <!-- VIRTUAL GARAGE / STOCK SECTION -->
  <section id="stock" class="py-24 bg-charcoal/50 border-y border-zinc-900">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-12">
        <div>
          <p class="text-xs uppercase tracking-[0.25em] text-brass mb-3" x-text="t.stockEyebrow"></p>
          <h2 class="font-display text-3xl md:text-5xl font-bold text-white" x-text="t.stockTitle"></h2>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-2">
          <template x-for="f in [
            {id:'all', label: t.filterAll},
            {id:'car', label: t.filterCars},
            {id:'moto', label: t.filterMotos},
            {id:'restoration', label: t.filterInRest}
          ]" :key="f.id">
            <button @click="stockFilter = f.id"
              :class="stockFilter === f.id ? 'bg-brass text-obsidian font-semibold border-brass' : 'bg-obsidian text-zinc-400 border-zinc-800 hover:border-zinc-700'"
              class="px-4 py-2 rounded-full text-xs uppercase tracking-wider border transition-all"
              x-text="f.label"></button>
          </template>
        </div>
      </div>

      <!-- Vehicles Grid -->
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <template x-for="item in filteredStock" :key="item.id">
          <article class="bg-obsidian border border-zinc-800/90 rounded-2xl overflow-hidden hover:border-brass/60 transition-all flex flex-col group">
            <div class="relative h-64 overflow-hidden bg-zinc-900">
              <img :src="item.image" :alt="item.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
              <!-- Status Badge -->
              <span class="absolute top-4 left-4 text-[11px] uppercase tracking-wider font-semibold px-3 py-1 rounded-full backdrop-blur-md"
                :class="{
                  'bg-emerald-950/90 text-emerald-300 border border-emerald-700/50': item.status === 'available',
                  'bg-amber-950/90 text-amber-300 border border-amber-700/50': item.status === 'restoration',
                  'bg-zinc-900/90 text-zinc-400 border border-zinc-700': item.status === 'sold'
                }"
                x-text="statusLabel(item.status)"></span>
              <span class="absolute top-4 right-4 bg-obsidian/80 backdrop-blur-md text-zinc-200 text-xs px-3 py-1 rounded-full border border-zinc-800" x-text="item.year"></span>
            </div>

            <div class="p-6 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between text-xs text-zinc-400 mb-2">
                  <span x-text="item.spec"></span>
                  <span x-text="item.origin"></span>
                </div>
                <h3 class="font-display text-2xl font-bold text-white mb-2" x-text="item.name"></h3>
                <p class="text-xs text-zinc-400 leading-relaxed mb-6" x-text="item.desc[lang]"></p>
              </div>

              <div class="pt-4 border-t border-zinc-800/80 flex items-center justify-between">
                <div>
                  <span class="text-[10px] uppercase tracking-widest text-zinc-500 block" x-text="t.priceLabel"></span>
                  <span class="font-display text-xl font-bold text-brass" x-text="formatPrice(item.priceEUR, item.status)"></span>
                </div>
                <button @click="selectVehicleForInquiry(item)" class="text-xs uppercase tracking-wider font-semibold text-white hover:text-brass flex items-center gap-1.5 transition-colors">
                  <span x-text="t.inquireBtn"></span> →
                </button>
              </div>
            </div>
          </article>
        </template>
      </div>
    </div>
  </section>

  <!-- TRANSPARENT EUROPEAN PROCESS -->
  <section id="process" class="py-20 bg-charcoal/40 border-t border-zinc-900">
    <div class="max-w-7xl mx-auto px-6">
      <div class="text-center max-w-2xl mx-auto mb-16">
        <p class="text-xs uppercase tracking-[0.25em] text-brass mb-3" x-text="t.procEyebrow"></p>
        <h2 class="font-display text-3xl md:text-4xl font-bold text-white" x-text="t.procTitle"></h2>
      </div>

      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <template x-for="(p, i) in t.procSteps" :key="i">
          <div class="bg-obsidian border border-zinc-800 p-6 rounded-2xl relative">
            <span class="text-xs font-bold uppercase tracking-widest text-brass block mb-3" x-text="'0' + (i+1)"></span>
            <h3 class="font-display text-xl font-bold text-white mb-2" x-text="p.title"></h3>
            <p class="text-xs text-zinc-400 leading-relaxed" x-text="p.desc"></p>
          </div>
        </template>
      </div>
    </div>
  </section>

  <!-- INTERACTIVE CONCIERGE & RESTORATION BRIEF (LEAD GEN) -->
  <section id="contact" class="py-24 max-w-5xl mx-auto px-6">
    <div class="bg-charcoal border border-zinc-800 rounded-3xl p-8 md:p-12">
      <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-4">
        <div class="max-w-xl">
          <p class="text-xs uppercase tracking-[0.25em] text-brass mb-2" x-text="t.formEyebrow"></p>
          <h2 class="font-display text-3xl md:text-4xl font-bold text-white mb-3" x-text="t.formTitle"></h2>
          <p class="text-sm text-zinc-400" x-text="t.formSub"></p>
        </div>
        <div class="bg-obsidian border border-zinc-800 rounded-2xl p-4 text-xs space-y-1.5 shrink-0">
          <div class="text-zinc-400 font-medium">Piotr Mantorski - PM Classics</div>
          <div><a href="tel:+48600030708" class="text-brass hover:underline font-semibold">+48 600 03 07 08</a></div>
          <div><a href="mailto:pmantorski@gmail.com" class="text-zinc-300 hover:text-brass">pmantorski@gmail.com</a></div>
        </div>
      </div>

      <form @submit.prevent="formSubmitted = true" class="space-y-8">
        <!-- 1. Service Type -->
        <div>
          <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-3" x-text="t.formStep1"></label>
          <div class="grid sm:grid-cols-3 gap-3">
            <template x-for="opt in t.formServiceOpts" :key="opt">
              <button type="button" @click="brief.service = opt"
                :class="brief.service === opt ? 'border-brass bg-brass/10 text-white' : 'border-zinc-800 bg-obsidian text-zinc-400 hover:border-zinc-700'"
                class="p-3.5 rounded-xl border text-left text-xs font-medium transition-all" x-text="opt"></button>
            </template>
          </div>
        </div>

        <!-- 2. Vehicle Category & Budget -->
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-3" x-text="t.formStep2"></label>
            <div class="grid grid-cols-2 gap-3">
              <template x-for="cat in t.formCatOpts" :key="cat">
                <button type="button" @click="brief.category = cat"
                  :class="brief.category === cat ? 'border-brass bg-brass/10 text-white' : 'border-zinc-800 bg-obsidian text-zinc-400'"
                  class="p-3.5 rounded-xl border text-center text-xs font-medium transition-all" x-text="cat"></button>
              </template>
            </div>
          </div>

          <div>
            <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-3" x-text="t.formBudget"></label>
            <select x-model="brief.budget" class="w-full bg-obsidian border border-zinc-800 rounded-xl p-3.5 text-xs text-white focus:border-brass outline-none">
              <option value="5k-10k EUR">5 000 – 10 000 EUR</option>
              <option value="10k-20k EUR">10 000 – 20 000 EUR</option>
              <option value="20k-35k+ EUR">20 000 – 35 000+ EUR</option>
            </select>
          </div>
        </div>

        <!-- 3. Model / Details & Contact -->
        <div class="grid md:grid-cols-2 gap-4">
          <input type="text" x-model="brief.name" required :placeholder="t.phName" class="bg-obsidian border border-zinc-800 rounded-xl p-3.5 text-sm text-white focus:border-brass outline-none"/>
          <input type="text" x-model="brief.contact" required :placeholder="t.phContact" class="bg-obsidian border border-zinc-800 rounded-xl p-3.5 text-sm text-white focus:border-brass outline-none"/>
        </div>

        <textarea x-model="brief.notes" rows="3" :placeholder="t.phNotes" class="w-full bg-obsidian border border-zinc-800 rounded-xl p-3.5 text-sm text-white focus:border-brass outline-none"></textarea>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
          <p class="text-xs text-zinc-400" x-text="t.formLangNote"></p>
          <button type="submit" class="gold-gradient text-obsidian font-bold text-xs uppercase tracking-widest px-8 py-4 rounded-full hover:opacity-95 transition-opacity" x-text="t.formSubmit"></button>
        </div>

        <div x-show="formSubmitted" x-cloak class="p-4 rounded-xl bg-emerald-950/60 border border-emerald-700/50 text-emerald-200 text-xs" x-text="t.formSuccess"></div>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="border-t border-zinc-900 py-12 text-xs text-zinc-500">
    <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <span class="text-white font-display font-bold tracking-wider">PM CLASSICS</span> - Piotr Mantorski (<a href="tel:+48600030708" class="hover:text-brass">+48 600 03 07 08</a> · <a href="mailto:pmantorski@gmail.com" class="hover:text-brass">pmantorski@gmail.com</a>)
      </div>
      <div>
        Designed &amp; Engineered by <span class="text-brass">Archie</span>
      </div>
    </div>
  </footer>

        get t() {
          return this.dict[this.lang];
        },

        get filteredStock() {
          if (this.stockFilter === 'all') return this.stockItems;
          if (this.stockFilter === 'restoration') return this.stockItems.filter(i => i.status === 'restoration');
          return this.stockItems.filter(i => i.type === this.stockFilter);
        },

        setLang(l) {
          this.lang = l;
          localStorage.setItem('pmc_lang', l);
          web4bizSeo.updateUrl('pmclassics', this.lang);
          this.brief.service = this.t.formServiceOpts[0];
          this.brief.category = this.t.formCatOpts[0];
        },

        setCurrency(c) {
          this.currency = c;
          localStorage.setItem('pmc_curr', c);
        },

        statusLabel(st) {
          const labels = {
            pl: { available: 'Dostępny od ręki', restoration: 'W renowacji · Rezerwacja', sold: 'Sprzedany' },
            en: { available: 'Available Now', restoration: 'In Build · Reservable', sold: 'Sold' },
            no: { available: 'Tilgjengelig nå', restoration: 'Under bygging · Reserverbar', sold: 'Solgt' }
          };
          return labels[this.lang][st];
        },

        formatPrice(eur, status) {
          if (status === 'sold') return this.lang === 'pl' ? 'Sprzedany' : (this.lang === 'no' ? 'Solgt' : 'Sold');
          const val = Math.round(eur * this.rates[this.currency]);
          return val.toLocaleString('pl-PL') + ' ' + this.currency;
        },

        selectVehicleForInquiry(item) {
          this.brief.service = this.t.formServiceOpts[0];
          this.brief.notes = `${item.year} ${item.name} (${this.formatPrice(item.priceEUR, item.status)})`;
          document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
        },

          for (const item of this.stockItems) {
            try {
              const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${item.wikiQuery}`);
              if (res.ok) {
                const data = await res.json();
                const imgUrl = (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source);
                if (imgUrl) {
                  item.image = imgUrl;
                  if (item.wikiQuery === 'Volvo_Amazon') {
                    this.heroImage = imgUrl;
                  }
                  if (item.wikiQuery === 'Opel_Manta') {
                    this.sliderBeforeImg = imgUrl;
                    this.sliderAfterImg = imgUrl;
                  }
                }
              }
            } catch (e) {
              // Keeps clean fallback URL if offline
            }
          }
        },

        init() {
          this.brief.service = this.t.formServiceOpts[0];
          this.brief.category = this.t.formCatOpts[0];
          this.loadAuthenticVehiclePhotos();
        }
      }
    }
  </script>
</body>
</html>
