<!DOCTYPE html>
<html lang="pl" x-data="caseStudyApp()" :data-theme="direction" class="scroll-smooth">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title x-text="currentCase.title[lang] + ' - Case Study | web4biz.pl'">Case Study - web4biz.pl</title>
  <meta name="description" content="Szczegółowe Case Study projektów web4biz.pl - wyzwanie biznesowe, architektura rozwiązania, interaktywne narzędzia i rezultaty wdrożenia."/>
  <meta name="robots" content="index, follow"/>

  <!-- Google Fonts: Space Grotesk + DM Sans + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       1. DESIGN TOKENS - 3 MOTYWY (STAŁA GEOMETRIA WE WSZYSTKICH MOTYWACH)
       ═══════════════════════════════════════════════════════════════════ */
    :root,
    [data-theme="editorial"] {
      --bg: #f4f2e9;
      --bg-alt: #e9e7dc;
      --surface: #faf9f4;
      --ink: #172019;
      --muted: #5e6459;
      --line: #d8d7cd;
      --accent: #d8fa52;
      --accent-ink: #172019;
      --signal: #477331;
      --hero-bg: #d8fa52;
      --hero-ink: #172019;
      --hero-muted: #34422a;
      --card-radius: 8px;
      --btn-radius: 6px;
      --ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out-snappy: cubic-bezier(0.215, 0.61, 0.355, 1);
      --display: 'Space Grotesk', sans-serif;
      --sans: 'DM Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    /* Widok 03 (Półksiężyc): Forest & Brass Executive Hybrid */
    [data-theme="forest"] {
      --bg: #141a16;
      --bg-alt: #1a221d;
      --surface: #1e2721;
      --ink: #f0f2e9;
      --muted: #aeb8ab;
      --line: rgba(240, 242, 233, 0.13);
      --accent: #d8fa52;
      --accent-ink: #141a16;
      --signal: #c5a059;
      --hero-bg: #18211b;
      --hero-ink: #f0f2e9;
      --hero-muted: #c2cbbd;
    }

    /* Widok 02 (Księżyc): 21st.dev Obsidian & Cyan */
    [data-theme="bento"] {
      --bg: #07090b;
      --bg-alt: #0c0f14;
      --surface: #11151c;
      --ink: #f4f6f8;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #06b6d4;
      --accent-ink: #061014;
      --signal: #22d3ee;
      --hero-bg: #07090b;
      --hero-ink: #f4f6f8;
      --hero-muted: #94a3b8;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [x-cloak] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: 5.5rem; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 240ms var(--ease-out-quart), color 240ms var(--ease-out-quart);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; color: inherit; }
    ::selection { background: var(--accent); color: var(--accent-ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .page-wrap { width: min(1340px, calc(100% - 64px)); margin-inline: auto; }
    .section-pad { padding-block: 96px; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Reading Progress Bar */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--signal);
      z-index: 100;
      transform-origin: left;
      transition: transform 80ms linear;
    }
    [data-theme="bento"] .progress-bar,
    [data-theme="forest"] .progress-bar {
      background: var(--accent);
    }

    .tactile {
      transition: transform 110ms var(--ease-out-snappy),
                  background-color 160ms var(--ease-out-snappy),
                  border-color 160ms var(--ease-out-snappy),
                  color 160ms var(--ease-out-snappy);
    }
    .tactile:active { transform: scale(0.96); }

    /* ═══════════════════════════════════════════════════════════════════
       2. NAWIGACJA + CASE STUDY MASTHEAD
       ═══════════════════════════════════════════════════════════════════ */
    .case-masthead {
      position: relative;
      background: var(--hero-bg);
      color: var(--hero-ink);
      padding: 20px 0 0;
      isolation: isolate;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }
    .case-masthead::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: '';
      opacity: 0.14;
      background-image:
        linear-gradient(currentColor 1px, transparent 1px),
        linear-gradient(90deg, currentColor 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(115deg, rgba(0,0,0,0.45) 0%, transparent 68%);
      -webkit-mask-image: linear-gradient(115deg, rgba(0,0,0,0.45) 0%, transparent 68%);
    }

    .nav-wrap {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid color-mix(in srgb, var(--hero-ink) 16%, transparent);
      margin-bottom: 42px;
    }
    .wordmark {
      font: 700 24px/1 var(--display);
      letter-spacing: -0.07em;
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
    }
    .wordmark-accent { color: var(--signal); }
    [data-theme="bento"] .wordmark-accent,
    [data-theme="forest"] .wordmark-accent { color: var(--accent); }
    .wordmark-sub {
      font: 500 10px var(--mono);
      letter-spacing: 0.08em;
      opacity: 0.65;
      margin-left: 10px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      font-size: 13px;
      font-weight: 600;
    }
    .nav-links a { position: relative; padding-bottom: 4px; }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 1.5px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 200ms var(--ease-out-quart);
    }
    .nav-links a:hover::after,
    .nav-links a.is-current::after { transform: scaleX(1); transform-origin: left; }

    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .lang-btn {
      height: 38px;
      min-width: 44px;
      padding: 0 13px;
      border-radius: var(--btn-radius);
      border: 1px solid color-mix(in srgb, var(--hero-ink) 22%, transparent);
      background: transparent;
      font: 600 11px var(--mono);
      cursor: pointer;
    }
    .lang-btn:hover { background: var(--hero-ink); color: var(--hero-bg); }

    .theme-dock {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: var(--btn-radius);
      border: 1px solid color-mix(in srgb, var(--hero-ink) 22%, transparent);
      background: color-mix(in srgb, var(--hero-ink) 6%, transparent);
    }
    .theme-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: calc(var(--btn-radius) - 2px);
      border: 0;
      background: transparent;
      color: var(--hero-ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 0.62;
    }
    .theme-icon-btn:hover { opacity: 1; }
    .theme-icon-btn.is-active {
      opacity: 1;
      background: var(--hero-ink);
      color: var(--hero-bg);
    }
    [data-theme="bento"] .theme-icon-btn.is-active,
    [data-theme="forest"] .theme-icon-btn.is-active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .theme-icon-btn svg { width: 16px; height: 16px; }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: var(--btn-radius);
      background: var(--hero-ink);
      color: var(--hero-bg);
      font-size: 12px;
      font-weight: 700;
    }
    [data-theme="bento"] .nav-cta,
    [data-theme="forest"] .nav-cta {
      background: var(--accent);
      color: var(--accent-ink);
    }

    /* Back Link & Quick Project Switcher */
    .masthead-top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 36px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .project-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .switch-pill {
      padding: 6px 12px;
      border-radius: var(--btn-radius);
      border: 1px solid color-mix(in srgb, var(--hero-ink) 22%, transparent);
      background: transparent;
      color: var(--hero-ink);
      font: 500 10.5px var(--mono);
      cursor: pointer;
    }
    .switch-pill.is-active,
    .switch-pill:hover {
      background: var(--hero-ink);
      color: var(--hero-bg);
      border-color: var(--hero-ink);
    }
    [data-theme="bento"] .switch-pill.is-active,
    [data-theme="forest"] .switch-pill.is-active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    .case-kicker {
      margin: 0;
      font: 500 11px/1.4 var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--signal);
    }
    [data-theme="bento"] .case-kicker,
    [data-theme="forest"] .case-kicker { color: var(--accent); }

    .case-title {
      max-width: 1000px;
      margin: 18px 0 18px;
      font: 600 clamp(2.8rem, 6.4vw, 5.8rem)/0.92 var(--display);
      letter-spacing: -0.08em;
    }
    .case-subtitle {
      max-width: 680px;
      margin: 0;
      color: var(--hero-muted);
      font-size: 18px;
      line-height: 1.65;
    }

    /* ═══════════════════════════════════════════════════════════════════
       3. CASE HERO ARTWORK STAGE + INTERAKTYWNA MAPA EUROPY
       ═══════════════════════════════════════════════════════════════════ */
.case-hero-art {
      position: relative;
      display: grid;
      height: clamp(400px, 42vw, 490px);
      place-items: center;
      margin-top: 40px;
      padding: clamp(14px, 2.5vw, 28px);
      overflow: hidden;
      border-radius: var(--card-radius);
      background: radial-gradient(ellipse at 50% 48%, #364338, #18211b 72%);
      isolation: isolate;
    }
    [data-theme="bento"] .case-hero-art {
      background: radial-gradient(ellipse at 50% 48%, #16222f, #090d12 75%);
      border: 1px solid var(--line);
    }
    .case-art-frame {
      width: min(100%, 1060px);
      height: 100%;
      border-radius: calc(var(--card-radius) / 1.2);
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.18);
      position: relative;
    }

    /* Interaktywna Mapa Europy SVG (AD REM T2) */
    .route-map-graphic { display: block; width: 100%; height: 100%; user-select: none; }
    .route-map-land { fill: #dfe6dc; }
    .route-map-land-secondary { fill: #d4ddd1; }
    .route-map-borders {
      fill: none;
      stroke: #bcc8ba;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .route-map-poland {
      fill: rgba(217, 4, 41, 0.14);
      stroke: #d90429;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    .route-corridor-idle {
      stroke: rgba(23, 32, 25, 0.16);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }
    @keyframes routeFlow {
      to { stroke-dashoffset: -28; }
    }
    .route-corridor-active {
      stroke: #d90429;
      stroke-width: 3.5;
      stroke-dasharray: 8 6;
      stroke-linecap: round;
      animation: routeFlow 0.9s linear infinite;
    }
    @keyframes radarPulse {
      0% { transform: scale(0.85); opacity: 0.85; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .map-pulse-ring {
      fill: none;
      stroke: #d90429;
      stroke-width: 2.5;
      transform-box: fill-box;
      transform-origin: center;
      animation: radarPulse 1.8s ease-out infinite;
      pointer-events: none;
    }
    .map-hub-group { cursor: pointer; }
    .map-hub-dot {
      fill: #ffffff;
      stroke: #172019;
      stroke-width: 3;
      transition: transform 150ms ease, fill 150ms ease, stroke 150ms ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .map-hub-group:hover .map-hub-dot,
    .map-hub-group.is-selected .map-hub-dot {
      fill: #d90429;
      stroke: #ffffff;
      transform: scale(1.3);
    }
    .map-hub-name {
      fill: #2c352e;
      stroke: #eef1ed;
      stroke-width: 3px;
      paint-order: stroke;
      font: 600 11.5px var(--mono);
      transition: fill 150ms ease;
    }
    .map-hub-group:hover .map-hub-name,
    .map-hub-group.is-selected .map-hub-name {
      fill: #d90429;
      font-weight: 700;
    }
    .route-map-start { fill: #d90429; stroke: #fff; stroke-width: 4; }
    .route-map-label {
      fill: #172019;
      stroke: #ffffff;
      stroke-width: 4px;
      paint-order: stroke;
      font: 700 13px var(--sans);
      letter-spacing: 0.02em;
    }

    .art-route-split {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      height: 100%;
      background: #eef1ed;
      color: #1a1a1a;
    }
.kubatura-split {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(0, 1.02fr);
      height: 100%;
      background: #eef1ed;
      color: #181a1f;
      overflow: hidden;
    }

    .art-route-map-box {
      position: relative;
      padding: 16px 20px;
      overflow: hidden;
      background: radial-gradient(circle at 55% 45%, #f5f7f4 0%, #e7ece5 100%);
    }
    .art-micro-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font: 600 10.5px var(--mono);
      letter-spacing: 0.05em;
      color: #4b5249;
    }
    .art-route-panel {
      background: #ffffff;
      border-left: 3px solid #d90429;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    /* Pigułki miast i przełącznik floty w kalkulatorze AD REM T2 */
    .hero-chip {
      appearance: none;
      -webkit-appearance: none;
      padding: 5px 9px;
      border-radius: 4px;
      border: 1px solid #d5d7d0;
      background: #f4f5f2;
      color: #374151;
      font: 600 10px var(--mono);
      cursor: pointer;
      transition: all 130ms ease;
    }
    .hero-chip:hover { border-color: #172019; color: #172019; }
    .hero-chip.is-active {
      background: #d90429;
      border-color: #d90429;
      color: #ffffff;
    }

    .fleet-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 3px;
      background: #f1f2ee;
      border: 1px solid #dcded8;
      border-radius: 5px;
    }
    .fleet-btn {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 5px 8px;
      border-radius: 3px;
      background: transparent;
      color: #555b53;
      font: 600 9.5px var(--mono);
      cursor: pointer;
      transition: all 130ms ease;
    }
    .fleet-btn.is-active {
      background: #172019;
      color: #ffffff;
    }

    .gemba-chip {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      padding: 8px 11px;
      border-radius: 3px;
      border: 1px solid #dfdcd2;
      background: #fcfbf8;
      color: #475053;
      font: 500 11.5px/1.35 var(--sans);
      text-align: left;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }
    .gemba-chip:hover { border-color: #b8432e; }
    .gemba-chip.is-active {
      border-color: #b8432e;
      background: #fdf3f1;
      color: #161e21;
      box-shadow: inset 3px 0 0 #b8432e;
    }

    .ck-mini-preview {
      height: 100%;
      padding: 56px 36px 24px;
      background: linear-gradient(135deg, #fde8d8 0%, #ffe0e6 100%);
      color: #1a1a1a;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .ck-mini-nav {
      position: absolute;
      inset: 0 0 auto;
      height: 42px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(26,26,26,0.09);
      font: 500 10.5px var(--mono);
      letter-spacing: 0.05em;
    }

    .pm-mini-preview {
      height: 100%;
      position: relative;
      background: #121312;
      color: #f4f4f5;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      isolation: isolate;
      overflow: hidden;
    }
    .pm-mini-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
      z-index: -2;
      filter: saturate(0.84) contrast(1.05);
    }
    .pm-mini-shade {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(11, 11, 12, 0.86) 0%, rgba(11, 11, 12, 0.45) 65%, rgba(11, 11, 12, 0.2) 100%),
        linear-gradient(0deg, rgba(11, 11, 12, 0.72) 0%, transparent 55%);
    }

    .art-react-stage {
      height: 100%;
      background: #d8fa52;
      color: #172019;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 4-Column Meta Grid */
    .case-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
      padding: 28px 0 34px;
    }
    .case-meta-grid > div {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .case-meta-grid span {
      color: var(--signal);
      font: 500 10px var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    [data-theme="bento"] .case-meta-grid span,
    [data-theme="forest"] .case-meta-grid span { color: var(--accent); }
    .case-meta-grid strong {
      max-width: 260px;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.5;
    }

    /* ═══════════════════════════════════════════════════════════════════
       4. STATS BAR & 2-COLUMN EDITORIAL CONTENT
       ═══════════════════════════════════════════════════════════════════ */
    .case-stats-section {
      background: var(--bg-alt);
      border-bottom: 1px solid var(--line);
    }
    .case-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .case-stat {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 20px 24px;
      border-left: 1px solid var(--line);
    }
    .case-stat:last-child { border-right: 1px solid var(--line); }
    .case-stat strong {
      font: 600 clamp(1.5rem, 2.8vw, 2.4rem)/1 var(--display);
      letter-spacing: -0.06em;
    }
    .case-stat span {
      max-width: 210px;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .case-content-layout {
      display: grid;
      grid-template-columns: 0.65fr 1.35fr;
      gap: 8vw;
      align-items: start;
    }
    .case-content-aside {
      position: sticky;
      top: 36px;
    }
    .case-content-aside ol {
      display: grid;
      gap: 14px;
      margin: 22px 0 28px;
      padding: 0;
      list-style: none;
    }
    .case-content-aside li a {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      transition: color 150ms ease;
    }
    .case-content-aside li a:hover { color: var(--ink); }
    .case-content-aside li span {
      color: var(--signal);
      font: 500 10.5px var(--mono);
    }
    [data-theme="bento"] .case-content-aside li span,
    [data-theme="forest"] .case-content-aside li span { color: var(--accent); }
    .case-aside-note {
      max-width: 220px;
      color: var(--muted);
      font: 500 9.5px/1.7 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .case-prose > section {
      position: relative;
      padding: 0 0 44px 56px;
      margin-bottom: 44px;
      border-bottom: 1px solid var(--line);
    }
    .case-section-number {
      position: absolute;
      top: 6px;
      left: 0;
      color: var(--signal);
      font: 500 11px var(--mono);
    }
    [data-theme="bento"] .case-section-number,
    [data-theme="forest"] .case-section-number { color: var(--accent); }
    .case-prose h2 {
      max-width: 700px;
      margin: 0 0 16px;
      font: 600 clamp(1.7rem, 2.8vw, 2.5rem)/1.06 var(--display);
      letter-spacing: -0.055em;
    }
    .case-prose p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.82;
    }
    .case-prose ul {
      display: grid;
      gap: 11px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }
    .case-prose li {
      position: relative;
      padding-left: 22px;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.7;
    }
    .case-prose li::before {
      position: absolute;
      left: 0;
      color: var(--signal);
      content: '↗';
      font-family: var(--mono);
    }
    [data-theme="bento"] .case-prose li::before,
    [data-theme="forest"] .case-prose li::before { color: var(--accent); }

    .btn-live {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 0 26px;
      border-radius: var(--btn-radius);
      background: var(--ink);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
    }
    [data-theme="bento"] .btn-live,
    [data-theme="forest"] .btn-live {
      background: var(--accent);
      color: var(--accent-ink);
    }

    /* Next Project Full-Width Banner */
    .case-next {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 64px max(32px, calc((100% - 1340px) / 2));
      background: var(--surface);
      color: var(--ink);
      border-top: 1px solid var(--line);
      cursor: pointer;
      transition: background-color 200ms var(--ease-out-quart);
    }
    .case-next:hover { background: var(--bg-alt); }
    .case-next > span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--signal);
      font: 500 10.5px var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    [data-theme="bento"] .case-next > span,
    [data-theme="forest"] .case-next > span { color: var(--accent); }
    .case-next > strong {
      font: 500 clamp(2.1rem, 4.6vw, 4.4rem)/0.98 var(--display);
      letter-spacing: -0.07em;
    }

  @media (max-width: 960px) {
      .case-meta-grid, .case-stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .case-stat { border-bottom: 1px solid var(--line); }
      .case-stat:nth-child(2n) { border-right: 1px solid var(--line); }
      .case-content-layout { grid-template-columns: 1fr; gap: 36px; }
      .case-content-aside { position: static; }
      .case-hero-art { height: auto; padding: 12px; }
      .art-route-split, .kubatura-split { grid-template-columns: 1fr; }
      .art-route-map-box { height: 260px; }
      .art-route-panel { border-left: 0; border-top: 3px solid #d90429; padding: 16px; }
      .kubatura-panel { border-left: 0 !important; border-top: 3px solid #ea580c; }
      .gemba-case-grid {
        height: auto !important;
        grid-template-columns: 1fr !important;
        padding: 18px 18px 16px !important;
        gap: 16px !important;
      }
      .gemba-case-glossary {
        position: static !important;
        height: auto !important;
        padding: 10px 18px !important;
        flex-wrap: wrap;
        gap: 8px;
      }
      .gemba-case-glossary > div { flex-wrap: wrap; gap: 12px !important; }
    }

    @media (max-width: 720px) {
      .page-wrap { width: calc(100% - 28px); }
      .section-pad { padding-block: 60px; }

      /* Nawigacja dopasowana do 360px */
      .nav-wrap { height: 64px; margin-bottom: 24px; gap: 8px; }
      .wordmark { font-size: 20px; }
      .nav-links, .wordmark-sub, .nav-cta { display: none; }
      .nav-actions { gap: 6px; }
      .lang-btn { height: 34px; min-width: 38px; padding: 0 9px; }
      .theme-icon-btn { width: 28px; height: 28px; }

      /* Nagłówek i przełącznik projektów */
      .masthead-top-bar { margin-bottom: 24px; gap: 12px; }
      .project-switcher { width: 100%; }
      .switch-pill { padding: 6px 10px; font-size: 10px; }
      .case-title { font-size: clamp(2rem, 9.5vw, 2.8rem); line-height: 0.98; letter-spacing: -0.06em; }
      .case-subtitle { font-size: 15px; }

      /* Podglądy projektów na wąskim ekranie */
      .case-hero-art { margin-top: 24px; padding: 8px; }
      .art-micro-header { flex-wrap: wrap; gap: 4px; font-size: 9px; }
      .ck-mini-preview { padding: 50px 18px 20px; min-height: 290px; }
      .ck-mini-nav { padding: 0 16px; font-size: 9.5px; }
      .ck-mini-nav span:last-child { display: none; }
      .pm-mini-preview { padding: 20px 18px; min-height: 300px; }

      /* Metadane, statystyki i treść */
      .case-meta-grid { grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 0 24px; }
      .case-stats-grid { grid-template-columns: 1fr; }
      .case-stat { min-height: auto; padding: 16px; border-right: 1px solid var(--line); }
      .case-prose > section { padding: 0 0 32px 0; margin-bottom: 32px; }
      .case-section-number { position: static; display: block; margin-bottom: 6px; }
      .btn-live { width: 100%; justify-content: center; }
      .case-next { padding: 40px 14px; }
    }
  </style>
</head>

<body>

  <!-- Reading Progress Bar -->
  <div class="progress-bar" :style="`transform: scaleX(${scrollProgress})`" aria-hidden="true"></div>

  <!-- ═══ CASE STUDY MASTHEAD + HEADER ═══ -->
  <header class="case-masthead" id="top">
    <div class="page-wrap">

      <!-- Main Navigation -->
      <div class="nav-wrap">
        <a href="index.html" class="wordmark">
          web<span class="wordmark-accent">4</span>biz<span>.pl</span>
          <span class="wordmark-sub">by archie.</span>
        </a>

        <nav class="nav-links" :aria-label="lang === 'pl' ? 'Główna nawigacja' : 'Main navigation'">
          <a href="index.html#work" class="is-current" x-text="lang === 'pl' ? 'Projekty (5)' : 'Projects (5)'"></a>
          <a href="index.html#estimator" x-text="lang === 'pl' ? 'Pakiety i wycena' : 'Tiers & Pricing'"></a>
          <a href="index.html#about" x-text="lang === 'pl' ? 'Podejście' : 'Approach'"></a>
          <a href="index.html#contact" x-text="lang === 'pl' ? 'Kontakt' : 'Contact'"></a>
        </nav>

        <div class="nav-actions">
          <!-- Language Switcher PL / EN -->
          <button type="button" class="lang-btn tactile" @click="toggleLang()"
            :aria-label="lang === 'pl' ? 'Switch to English' : 'Zmień język na polski'"
            x-text="lang === 'pl' ? 'EN' : 'PL'"></button>

          <!-- 3-Theme Switcher: Słoneczko (01) / Półksiężyc (03) / Księżyc (02) -->
          <div class="theme-dock" role="group" :aria-label="lang === 'pl' ? 'Wybierz motyw kolorystyczny' : 'Choose color theme'">
            <button type="button" class="theme-icon-btn tactile"
              :class="direction === 'editorial' ? 'is-active' : ''"
              @click="setDirection('editorial')"
              :title="lang === 'pl' ? 'Widok 01: Jasny (Lime & Paper)' : 'View 01: Light (Lime & Paper)'"
              aria-label="Widok 01">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="10" cy="10" r="3.6"/>
                <path d="M10 2v2.2M10 15.8V18M18 10h-2.2M4.2 10H2M15.66 4.34l-1.56 1.56M5.9 14.1l-1.56 1.56M15.66 15.66l-1.56-1.56M5.9 5.9 4.34 4.34"/>
              </svg>
            </button>

            <button type="button" class="theme-icon-btn tactile"
              :class="direction === 'forest' ? 'is-active' : ''"
              @click="setDirection('forest')"
              :title="lang === 'pl' ? 'Widok 03: Półmrok (Forest & Brass)' : 'View 03: Dusk (Forest & Brass)'"
              aria-label="Widok 03">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10" cy="10" r="6.5"/>
                <path d="M10 3.5a6.5 6.5 0 0 1 0 13V3.5Z" fill="currentColor"/>
              </svg>
            </button>

            <button type="button" class="theme-icon-btn tactile"
              :class="direction === 'bento' ? 'is-active' : ''"
              @click="setDirection('bento')"
              :title="lang === 'pl' ? 'Widok 02: Nocny (Obsidian & Cyan)' : 'View 02: Night (Obsidian & Cyan)'"
              aria-label="Widok 02">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.8 12.4A6.8 6.8 0 0 1 7.6 3.2a6.9 6.9 0 1 0 9.2 9.2Z"/>
              </svg>
            </button>
          </div>

          <a href="index.html#estimator" class="nav-cta tactile">
            <span x-text="lang === 'pl' ? 'Wyceń projekt' : 'Start a project'"></span>
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </div>

      <!-- Back Link + Quick 5-Project Switcher -->
      <div class="masthead-top-bar">
        <a href="index.html#work" class="back-link tactile">
          <span aria-hidden="true">←</span>
          <span x-text="lang === 'pl' ? 'Wszystkie projekty (5)' : 'All projects (5)'"></span>
        </a>

        <div class="project-switcher" role="tablist" :aria-label="lang === 'pl' ? 'Przełącz Case Study' : 'Switch Case Study'">
          <template x-for="(id, idx) in projectOrder" :key="id">
            <button type="button" class="switch-pill tactile"
              :class="projectId === id ? 'is-active' : ''"
              @click="selectProject(id)"
              x-text="'0' + (idx + 1) + ' · ' + cases[id].shortName[lang]"></button>
          </template>
        </div>
      </div>

      <!-- Kicker, H1 Title & Subtitle -->
      <p class="case-kicker">
        <span x-text="currentCase.tag[lang]"></span>
        <span style="opacity:0.7;" x-text="' / ' + currentCase.year"></span>
      </p>
      <h1 class="case-title" x-text="currentCase.title[lang]"></h1>
      <p class="case-subtitle" x-text="currentCase.subtitle[lang]"></p>

      <!-- CASE HERO ARTWORK STAGE -->
      <div class="case-hero-art" role="img" :aria-label="currentCase.title[lang]">
        <div class="case-art-frame">

          <!-- ═══ Artwork 1: AD REM T2 - INTERAKTYWNA MAPA 8 HUBÓW EUROPY + KALKULATOR FLOTY ═══ -->
          <div x-show="projectId === 'adremt2'" class="art-route-split">
            <div class="art-route-map-box">
              <div class="art-micro-header">
                <span style="display:inline-flex; align-items:center; gap:6px;">
                  <i style="width:7px; height:7px; border-radius:50%; background:#d90429; display:inline-block;"></i>
                  <span x-text="lang === 'pl' ? 'INTERAKTYWNA MAPA TRAS - KLIKNIJ LUB NAJEDŹ NA MIASTO' : 'INTERACTIVE ROUTE MAP - HOVER OR CLICK ANY CITY'"></span>
                </span>
                <span style="color:#d90429; font-weight:700;" x-text="lang === 'pl' ? '◉ WARSZAWA (BAZA)' : '◉ WARSAW (HUB)'"></span>
              </div>

              <svg class="route-map-graphic" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice" style="position:absolute; inset:32px 0 0; height:calc(100% - 32px);">
                <!-- Kontury Europy + Granice Państw -->
                <path class="route-map-land" d="m101 76 41-25 34 8 24-23 39 12 28 31 34-8 30 18 27-9 30 21 41-12 30 22 43-5 24 23 43-2 23 29 40 14 13 32-19 25-35 7-5 30-28 15-12 34-34 12-15 32-39 6-20 27-37-4-20-26-31-5-18-24-36-2-19-24-31-4-13-24-32-14-10-25-32-13-15-28-35-9-9-28-31-6-12-24 20-26Z"/>
                <path class="route-map-land route-map-land-secondary" d="m73 256 38 7 28 27-10 34-33 20-30-21-9-34Zm209 172 31-22 35 9 8 22-27 21-34-7Zm286 24 32-18 25 10-12 25-31 8Zm-75-436 34-13 30 15-13 25-32-4Z"/>
                <g class="route-map-borders">
                  <path d="m199 79 21 48 39 22 25-19 34 26-9 47 28 26-10 37-31 17 2 41-32 19-17 42"/>
                  <path d="m263 79 20 52 38 25 37-12 26 29-8 37 34 22-9 34-36 17 1 43-28 22"/>
                  <path d="m344 91 11 42 39 23 19 39-22 30 27 25-7 39 28 26-17 39"/>
                  <path d="m419 103 20 39 34 16 15 38-18 33 25 27-6 39 31 18"/>
                  <path d="m493 105 18 46 36 13 15 40-20 26 26 27-12 40 26 20"/>
                  <path d="m568 126 23 37 36 11 15 31-16 33 27 31-16 37"/>
                  <path d="m134 167 44 14 21 31-14 34 20 27-7 33m-83-16 49 9 27 30 42 9 20 29"/>
                </g>
                <path class="route-map-poland" d="m480 193 30-14 34 8 18 25 31 7 7 33-17 25 5 31-26 20-31-8-20 13-27-15-17-25-24-8-5-27 18-20Z"/>

                <!-- Siatka wszystkich 8 korytarzy drogowych z Warszawy (534, 235) -->
                <g>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="295" y2="235"/>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="418" y2="222"/>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="375" y2="365"/>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="245" y2="285"/>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="468" y2="318"/>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="438" y2="270"/>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="485" y2="120"/>
                  <line class="route-corridor-idle" x1="534" y1="235" x2="155" y2="395"/>
                </g>

                <!-- Aktywna animowana linia trasy z Warszawy do wybranego miasta -->
                <line class="route-corridor-active" x1="534" y1="235" :x2="activeCity.x" :y2="activeCity.y"/>

                <!-- Pulsujący pierścień wokół wybranego miasta docelowego -->
                <circle class="map-pulse-ring" :cx="activeCity.x" :cy="activeCity.y" r="11"/>

                <!-- 8 Klikalnych Hubów Europejskich z podpisami bezpośrednio na mapie -->
                <!-- 0: Rotterdam -->
                <g class="map-hub-group" :class="selectedCityIdx === 0 ? 'is-selected' : ''" @click="selectedCityIdx = 0" @mouseenter="selectedCityIdx = 0">
                  <circle class="map-hub-dot" cx="295" cy="235" r="7"/>
                  <text class="map-hub-name" x="283" y="223" text-anchor="end">Rotterdam</text>
                </g>
                <!-- 1: Berlin -->
                <g class="map-hub-group" :class="selectedCityIdx === 1 ? 'is-selected' : ''" @click="selectedCityIdx = 1" @mouseenter="selectedCityIdx = 1">
                  <circle class="map-hub-dot" cx="418" cy="222" r="7"/>
                  <text class="map-hub-name" x="418" y="207" text-anchor="middle">Berlin</text>
                </g>
                <!-- 2: Mediolan -->
                <g class="map-hub-group" :class="selectedCityIdx === 2 ? 'is-selected' : ''" @click="selectedCityIdx = 2" @mouseenter="selectedCityIdx = 2">
                  <circle class="map-hub-dot" cx="375" cy="365" r="7"/>
                  <text class="map-hub-name" x="375" y="386" text-anchor="middle" x-text="lang === 'pl' ? 'Mediolan' : 'Milan'"></text>
                </g>
                <!-- 3: Paryż -->
                <g class="map-hub-group" :class="selectedCityIdx === 3 ? 'is-selected' : ''" @click="selectedCityIdx = 3" @mouseenter="selectedCityIdx = 3">
                  <circle class="map-hub-dot" cx="245" cy="285" r="7"/>
                  <text class="map-hub-name" x="233" y="290" text-anchor="end" x-text="lang === 'pl' ? 'Paryż' : 'Paris'"></text>
                </g>
                <!-- 4: Wiedeń -->
                <g class="map-hub-group" :class="selectedCityIdx === 4 ? 'is-selected' : ''" @click="selectedCityIdx = 4" @mouseenter="selectedCityIdx = 4">
                  <circle class="map-hub-dot" cx="468" cy="318" r="7"/>
                  <text class="map-hub-name" x="480" y="323" text-anchor="start" x-text="lang === 'pl' ? 'Wiedeń' : 'Vienna'"></text>
                </g>
                <!-- 5: Praga -->
                <g class="map-hub-group" :class="selectedCityIdx === 5 ? 'is-selected' : ''" @click="selectedCityIdx = 5" @mouseenter="selectedCityIdx = 5">
                  <circle class="map-hub-dot" cx="438" cy="270" r="7"/>
                  <text class="map-hub-name" x="426" y="274" text-anchor="end" x-text="lang === 'pl' ? 'Praga' : 'Prague'"></text>
                </g>
                <!-- 6: Sztokholm -->
                <g class="map-hub-group" :class="selectedCityIdx === 6 ? 'is-selected' : ''" @click="selectedCityIdx = 6" @mouseenter="selectedCityIdx = 6">
                  <circle class="map-hub-dot" cx="485" cy="120" r="7"/>
                  <text class="map-hub-name" x="485" y="105" text-anchor="middle" x-text="lang === 'pl' ? 'Sztokholm' : 'Stockholm'"></text>
                </g>
                <!-- 7: Madryt -->
                <g class="map-hub-group" :class="selectedCityIdx === 7 ? 'is-selected' : ''" @click="selectedCityIdx = 7" @mouseenter="selectedCityIdx = 7">
                  <circle class="map-hub-dot" cx="155" cy="395" r="7"/>
                  <text class="map-hub-name" x="155" y="415" text-anchor="middle" x-text="lang === 'pl' ? 'Madryt' : 'Madrid'"></text>
                </g>

                <!-- Plakietka dystansu na środku aktywnej trasy -->
                <g :transform="`translate(${(534 + activeCity.x) / 2}, ${(235 + activeCity.y) / 2 - 10})`" style="pointer-events:none;">
                  <rect x="-42" y="-12" width="84" height="22" rx="4" fill="#172019" stroke="#ffffff" stroke-width="1.5"/>
                  <text x="0" y="3" text-anchor="middle" fill="#d8fa52" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" x-text="activeCity.km + ' km'"></text>
                </g>

                <!-- Punkt Bazowy: Warszawa -->
                <circle class="map-pulse-ring" cx="534" cy="235" r="10"/>
                <circle class="route-map-start" cx="534" cy="235" r="10"/>
                <text class="route-map-label" x="550" y="240" x-text="lang === 'pl' ? 'WARSZAWA' : 'WARSAW'"></text>
              </svg>
            </div>

            <!-- Prawy Panel Kalkulatora Tras i Floty -->
            <div class="art-route-panel">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                  <span style="font:600 10px var(--mono); color:#d90429;" x-text="lang === 'pl' ? '↳ KALKULATOR TRASY I FLOTY' : '↳ ROUTE & FLEET CALCULATOR'"></span>
                  <span style="font:600 9.5px var(--mono); color:#555b53;" x-text="activeCity.country"></span>
                </div>
                <h3 style="margin:0 0 8px; font:700 22px/1.05 var(--display); color:#172019;" x-text="lang === 'pl' ? 'Dokąd jedziemy?' : 'Where to next?'"></h3>

                <!-- Przełącznik typu floty: Bus Express vs FTL 24t -->
                <div class="fleet-switch" style="margin-bottom:10px;">
                  <button type="button" class="fleet-btn" :class="fleetType === 'bus' ? 'is-active' : ''" @click="fleetType = 'bus'"
                    x-text="lang === 'pl' ? '⚡ Bus Express (do 1.5t)' : '⚡ Express Van (1.5t)'"></button>
                  <button type="button" class="fleet-btn" :class="fleetType === 'ftl' ? 'is-active' : ''" @click="fleetType = 'ftl'"
                    x-text="lang === 'pl' ? '🚛 Naczepa FTL (24t)' : '🚛 FTL Semi-Truck (24t)'"></button>
                </div>

                <!-- Siatka 8 przycisków miast -->
                <div style="display:flex; flex-wrap:wrap; gap:4px;">
                  <template x-for="(city, cIdx) in heroCities" :key="city.id">
                    <button type="button" class="hero-chip"
                      :class="selectedCityIdx === cIdx ? 'is-active' : ''"
                      @click="selectedCityIdx = cIdx"
                      x-text="city.name[lang]"></button>
                  </template>
                </div>
              </div>

              <!-- Wynik Kalkulacji Na Żywo -->
              <div class="tabular" style="padding:10px 12px; background:#f8f9f7; border:1px solid #e1e4de; border-radius:5px; font:600 11.5px/1.45 var(--mono); color:#172019;">
                <div style="display:flex; justify-content:space-between; color:#555b53; font-size:9.5px; margin-bottom:3px;">
                  <span x-text="lang === 'pl' ? 'WYBRANA RELACJA:' : 'SELECTED CORRIDOR:'"></span>
                  <span x-text="fleetType === 'bus' ? 'DOOR-TO-DOOR EXPRESS' : 'FTL 13.6M STANDARD'"></span>
                </div>
                <div style="font-size:13px; font-weight:700;">
                  <span x-text="(lang === 'pl' ? 'Warszawa → ' : 'Warsaw → ') + activeCity.name[lang]"></span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:4px; padding-top:4px; border-top:1px dashed #d5d8d2;">
                  <span><b style="color:#d90429;" x-text="activeCity.km + ' km'"></b> <small style="color:#555b53;" x-text="'(' + activeCity.highway + ')'"></small></span>
                  <span style="color:#172019;" x-text="(lang === 'pl' ? 'Czas: ' : 'ETA: ') + (fleetType === 'bus' ? activeCity.busTime : activeCity.ftlTime)"></span>
                </div>
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; font:600 10px var(--mono); color:#5a5a5a;">
                <span x-text="lang === 'pl' ? '◷ Dyspozytor 24/7 · 0 PLN API' : '◷ 24/7 Dispatcher · 0 EUR API'"></span>
                <a href="https://adremt2.pl/index2.html" target="_blank" rel="noopener" style="color:#d90429; text-decoration:underline;" x-text="lang === 'pl' ? 'Pełna mapa ↗' : 'Full map ↗'"></a>
              </div>
            </div>
          </div>

        get currentCase() {
          return this.cases[this.projectId] || this.cases['adremt2'];
        },

        get activeCity() {
          return this.heroCities[this.selectedCityIdx] || this.heroCities[0];
        },

        get nextProjectId() {
          const idx = this.projectOrder.indexOf(this.projectId);
          return this.projectOrder[(idx + 1) % this.projectOrder.length];
        },

        selectProject(id) {
          if (this.cases[id]) {
            this.projectId = id;
            const url = new URL(window.location);
            url.searchParams.set('project', id);
            window.history.replaceState({}, '', url);
          }
        },

        setDirection(dir) {
          this.direction = dir;
          localStorage.setItem('w4b_theme', dir);
        },

        toggleLang() {
          this.lang = this.lang === 'pl' ? 'en' : 'pl';
          localStorage.setItem('lang', this.lang);
        },

        async loadAuthenticClassicPhoto() {
          try {
            const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/Volvo_Amazon');
            if (res.ok) {
              const data = await res.json();
              const imgUrl = (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source);
              if (imgUrl) this.classicCarImg = imgUrl;
            }
          } catch (e) {
            // Keeps verified Wikimedia Commons 1966 Volvo Amazon fallback
          }
        },

        init() {
          const params = new URLSearchParams(window.location.search);
          const requested = params.get('project');
          if (requested && this.cases[requested]) {
            this.projectId = requested;
          }

          window.addEventListener('scroll', () => {
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            this.scrollProgress = docHeight > 0 ? Math.min(1, Math.max(0, window.scrollY / docHeight)) : 0;
          }, { passive: true });

          this.loadAuthenticClassicPhoto();
        }
      }
    }
